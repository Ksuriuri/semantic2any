# 4-utterance overfit of s2vae (en+ja Paimon listen pairs). 1 GPU.
seed: 1237
target:
  type: vae_latent
paths:
  model_dir: checkpoints/feature-extractors
  semantic_codec_ckpt: ''
  campplus_ckpt: campplus/campplus_cn_common.bin
  w2v_bert_dir: w2v-bert-2.0
  w2v_stat: wav2vec2bert_stats.pt
  dots_tts_dir: checkpoints/dots-tts
semantic_codec:
  type: indextts2.5
vocoder:
  model_id: nvidia/bigvgan_v2_22khz_80band_256x
  cache_dir: checkpoints/huggingface
  local_files_only: true
data:
  train_jsonl: /mnt/data_sdd/hhy/noiz-tts/semantic2any/configs/overfit4/train4.jsonl
  valid_jsonl: /mnt/data_sdd/hhy/noiz-tts/semantic2any/configs/overfit4/valid4.jsonl
  train_speechdata_dir: ''
  valid_speechdata_dir: ''
  speechdata_cache_dir: .cache/speechdata
  max_audio_seconds: 30.0
  pair_same_speaker: true
  random_split_audio: false
  max_pair_seconds: 60.0
  min_pair_prompt_seconds: 3.0
  min_prompt_seconds: 3.0
  max_prompt_seconds: 30.0
  min_target_seconds: 3.0
  max_target_seconds: 30.0
  allow_singleton_split: false
  min_generated_frames: 8
  semantic_fps: 50.0
  sample_rate_16k: 16000
  sample_rate_mel: 22050
  sample_rate_vae: 48000
  extract_mel_in_worker: false
  num_workers: 2
  prefetch_factor: 2
  decode_audio_in_worker: true
  skip_audio_errors: true
  feature_batch_size: 2
  async_feature_extraction: false
  preload_features: false
  prompt_bandwidth_aug_prob: 0.0
  prompt_bandwidth_aug_rates:
  - 16000
  - 22050
  length_bucketed_batches: false
  length_bucket_boundaries:
  - 8
  - 60
preprocess_params:
  sr: 22050
  spect_params:
    n_fft: 1024
    win_length: 1024
    hop_length: 256
    n_mels: 80
    fmin: 0
    fmax: None
s2mel:
  dit_type: DiT
  reg_loss_type: l2
  feat_scale: 1.0
  high_band_mse_extra: 0.0
  use_gpt_latent: false
  inference_steps: 25
  inference_cfg_rate: 0.7
  length_ratio: 0.5
  style_encoder:
    dim: 192
  length_regulator:
    channels: 512
    is_discrete: false
    in_channels: 1024
    time_align: pack2
    content_codebook_size: 8192
    sampling_ratios:
    - 1
    - 1
    - 1
    - 1
    n_codebooks: 1
    quantizer_dropout: 0.0
    f0_condition: false
    n_f0_bins: 512
  DiT:
    hidden_dim: 512
    num_heads: 8
    depth: 13
    class_dropout_prob: 0.0
    block_size: 8192
    in_channels: 128
    style_condition: false
    final_layer_type: wavenet
    content_dim: 512
    content_codebook_size: 1024
    content_type: continuous
    is_causal: false
    long_skip_connection: true
    zero_prompt_speech_token: false
    time_as_token: false
    style_as_token: false
    uvit_skip_connection: true
  wavenet:
    hidden_dim: 512
    num_layers: 8
    kernel_size: 5
    dilation_rate: 1
    p_dropout: 0.0
    style_condition: false
train:
  output_dir: exp/s2vae_overfit4
  batch_size: 2
  epochs: 20000
  max_steps: 30000
  grad_accumulation: 1
  find_unused_parameters: true
  learning_rate: 1.0e-04
  min_learning_rate: 1.0e-05
  lr_scheduler: cosine
  weight_decay: 0.0
  warmup_steps: 200
  grad_clip: 1.0
  mixed_precision: bf16
  log_interval: 20
  valid_interval: 500
  save_interval: 2000
  archive_save_interval: 10000
  keep_last: 4
  fresh_lr_schedule: true
  resume_from: ""
  no_wandb: false
  wandb_entity: haoyuanhuang22-jcxy
  wandb_project: semantic2mel
  wandb_run_name: s2vae-overfit4-paimon
