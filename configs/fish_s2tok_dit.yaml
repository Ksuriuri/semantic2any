# New task baseline; frozen Fish features, no temporal downsampling.
codec:
  repo: /path/to/fish-speech
  checkpoint: /path/to/codec.pth
  sha256: 74fc41c5a7151c6f350af8bd7e5d6e3accfcc7f3dfbfac23afd35af07052bb2f
data:
  train_manifest: /path/to/train-pairs.jsonl
  valid_manifest: /path/to/valid-pairs.jsonl
  max_target_frames: 512
  max_reference_frames: 172
  num_workers: 4
model:
  dit_type: DiT
  reg_loss_type: l2
  feat_scale: 1.0
  high_band_mse_extra: 0.0
  use_gpt_latent: false
  inference_steps: 25
  inference_cfg_rate: 0.7
  style_encoder:
    dim: 192
  DiT:
    hidden_dim: 512
    num_heads: 8
    depth: 13
    class_dropout_prob: 0.1
    block_size: 8192
    in_channels: 1024
    style_condition: false
    final_layer_type: wavenet
    content_dim: 512
    content_codebook_size: 1024
    content_type: continuous
    is_causal: false
    long_skip_connection: true
    zero_prompt_speech_token: true
    time_as_token: false
    style_as_token: false
    uvit_skip_connection: true
  wavenet:
    hidden_dim: 512
    num_layers: 8
    kernel_size: 5
    dilation_rate: 1
    p_dropout: 0.2
    style_condition: false
train:
  output_dir: exp/fish_s2tok_dit
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  epochs: 3
  save_every: 1000
  validate_every: 1000
  validation_batches: 20
  seed: 1234
  mixed_precision: bf16
