seed: 1234

paths:
  model_dir: checkpoints/feature-extractors
  semantic_codec_ckpt: ""
  campplus_ckpt: campplus/campplus_cn_common.bin
  w2v_bert_dir: w2v-bert-2.0
  w2v_stat: wav2vec2bert_stats.pt

semantic_codec:
  # Pinned: these codes/manifests predate the indextts25 default.
  type: maskgct
vocoder:
  model_id: nvidia/bigvgan_v2_44khz_128band_512x
  cache_dir: checkpoints/huggingface
  local_files_only: true

data:
  train_jsonl: /mnt/data_sdd/hhy/noiz-tts/semantic2any/overfit_exp/paired_features/paired_manifest.jsonl
  valid_jsonl: /mnt/data_sdd/hhy/noiz-tts/semantic2any/overfit_exp/paired_features/paired_manifest.jsonl
  train_speechdata_dir: ""
  valid_speechdata_dir: ""
  speechdata_cache_dir: ""
  max_audio_seconds: 190.0
  pair_same_speaker: false
  random_split_audio: false
  min_prompt_seconds: 3.0
  max_prompt_seconds: 30.0
  min_target_seconds: 3.0
  min_generated_frames: 8
  semantic_fps: 50.0
  sample_rate_16k: 16000
  sample_rate_mel: 44100
  num_workers: 0
  prefetch_factor: null
  decode_audio_in_worker: true
  skip_audio_errors: true
  feature_batch_size: 1
  async_feature_extraction: false
  preload_features: false
  preload_batch_size: 4
  prompt_bandwidth_aug_prob: 0.0
  length_bucketed_batches: false
  length_bucket_boundaries: []

preprocess_params:
  sr: 44100
  spect_params:
    n_fft: 2048
    win_length: 2048
    hop_length: 512
    n_mels: 128
    fmin: 0
    fmax: "None"

s2mel:
  dit_type: DiT
  reg_loss_type: l2
  use_gpt_latent: false
  inference_steps: 25
  inference_cfg_rate: 0.7
  length_ratio: 1.72265625
  style_encoder:
    dim: 192
  length_regulator:
    channels: 512
    is_discrete: false
    in_channels: 1024
    content_codebook_size: 8192
    sampling_ratios: [1, 1, 1, 1]
    n_codebooks: 1
    quantizer_dropout: 0.0
    f0_condition: false
    n_f0_bins: 512
  DiT:
    hidden_dim: 512
    num_heads: 8
    depth: 13
    class_dropout_prob: 0.0
    block_size: 8192
    in_channels: 128
    style_condition: false
    final_layer_type: wavenet
    content_dim: 512
    content_codebook_size: 1024
    content_type: continuous
    is_causal: false
    long_skip_connection: true
    zero_prompt_speech_token: false
    time_as_token: false
    style_as_token: false
    uvit_skip_connection: true
  wavenet:
    hidden_dim: 512
    num_layers: 8
    kernel_size: 5
    dilation_rate: 1
    p_dropout: 0.0
    style_condition: false

train:
  output_dir: overfit_exp/exp8_waveform_only
  batch_size: 1
  epochs: 100000
  max_steps: 100000
  grad_accumulation: 1
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_steps: 50
  lr_scheduler: cosine
  grad_clip: 1.0
  fresh_lr_schedule: false
  find_unused_parameters: true
  mixed_precision: bf16
  log_interval: 50
  valid_interval: 5000
  save_interval: 20000
  archive_save_interval: 20000
  keep_last: 3
  resume_from: ""
  no_wandb: false
  wandb_entity: haoyuanhuang22-jcxy
  wandb_project: semantic2mel
  wandb_run_name: overfit-exp8-waveform-only
